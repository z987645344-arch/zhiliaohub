# ---------------------------------------------------------------------------
# 还原 gateway 传来的真实客户端 IP
#
# 链路是 访客 → zhiliao-gateway → 本 nginx → admin-server(Express)。
# gateway 以追加语义写入 X-Forwarded-For，本 nginx 只信任现场实测得到的
# Compose 桥网关网段，并在 real_ip_recursive 默认 off 下取 XFF 最右一项。
# 这会把 $remote_addr 还原为真实客户端；随后 $proxy_add_x_forwarded_for
# 追加的最右一项仍是真实客户端，与 Express TRUST_PROXY_HOPS=1 对应。
#
# 信任来源必须精确限定，绝不能写 0.0.0.0/0。无条件信任 XFF 会让任意
# 直连者伪造来源 IP，绕过密码、TOTP、设备认证和反馈提交的按 IP 限流。
# app-network 没有固定子网，网关可随网络重建变化；TRUSTED_PROXY_CIDR 必须由部署现场
# 实测确定，不得把开发机上观察到的桥网关地址写死进仓库。
# ---------------------------------------------------------------------------

map $uri $lab_asset_content_encoding {
    default "";
    ~*\.br$ br;
    ~*\.gz$ gzip;
}

set_real_ip_from ${TRUSTED_PROXY_CIDR};
real_ip_header X-Forwarded-For;

server {
    listen 80;
    server_name ${SERVER_NAME};

    root /app/runtime/public/site;
    index index.html;
    charset utf-8;
    client_max_body_size ${NGINX_CLIENT_MAX_BODY_SIZE};

    error_page 404 /assets/errors/404.html;
    error_page 403 /assets/errors/403.html;
    location = /assets/errors/404.html { internal; }
    location = /assets/errors/403.html { internal; }

    location = /health {
        proxy_pass http://admin-server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # gateway 只有 TLS :443 server 会反代到本机；写死 https 与本 nginx 只绑回环是同一组承重假设。
        proxy_set_header X-Forwarded-Proto https;
    }

    # Unity WebGL uses the same two lab upload routes and needs the larger
    # request-body ceiling; keep this regex before the ordinary uploads route.
    location ~ ^/(?:api/admin/lab/upload|admin/lab/upload)$ {
        client_max_body_size 300m;
        client_body_timeout 300s;
        proxy_request_buffering off;
        proxy_pass http://admin-server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # gateway 只有 TLS :443 server 会反代到本机；写死 https 与本 nginx 只绑回环是同一组承重假设。
        proxy_set_header X-Forwarded-Proto https;
    }

    # Ordinary media uploads retain the global request-body ceiling; only the
    # existing slow-body timeout and streaming behavior remain here.
    location ~ ^/api/admin/uploads$ {
        client_body_timeout 300s;
        proxy_request_buffering off;
        proxy_pass http://admin-server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # gateway 只有 TLS :443 server 会反代到本机；写死 https 与本 nginx 只绑回环是同一组承重假设。
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ ^/(?:admin|api|uploads)(?:/|$) {
        proxy_pass http://admin-server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # gateway 只有 TLS :443 server 会反代到本机；写死 https 与本 nginx 只绑回环是同一组承重假设。
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self'; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; form-action 'self'; frame-src 'none'; frame-ancestors 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    server_name ${LAB_SERVER_NAME};

    root /app/runtime/public/lab-storage;
    index index.html;
    charset utf-8;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; connect-src 'self'; form-action 'none'; frame-src 'none'; frame-ancestors 'none'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Only compressed files get this header; empty values are omitted.
    add_header Content-Encoding $lab_asset_content_encoding;

    location ~ (^|/)\. {
        deny all;
    }

    # Keep the suffixed files on disk; clear Nginx's .gz MIME guess and restore
    # the underlying type while the server-level security headers are inherited.
    location ~* \.wasm\.(?:br|gz)$ { types { } default_type application/wasm; }
    location ~* \.(?:m?js)\.(?:br|gz)$ { types { } default_type application/javascript; }
    location ~* \.data\.(?:br|gz)$ { types { } default_type application/octet-stream; }
    location ~* \.html?\.(?:br|gz)$ { types { } default_type text/html; }
    location ~* \.css\.(?:br|gz)$ { types { } default_type text/css; }
    location ~* \.(?:json|map)\.(?:br|gz)$ { types { } default_type application/json; }
    location ~* \.txt\.(?:br|gz)$ { types { } default_type text/plain; }
    location ~* \.xml\.(?:br|gz)$ { types { } default_type application/xml; }
    location ~* \.svg\.(?:br|gz)$ { types { } default_type image/svg+xml; }
    location ~* \.(?:jpe?g)\.(?:br|gz)$ { types { } default_type image/jpeg; }
    location ~* \.png\.(?:br|gz)$ { types { } default_type image/png; }
    location ~* \.gif\.(?:br|gz)$ { types { } default_type image/gif; }
    location ~* \.webp\.(?:br|gz)$ { types { } default_type image/webp; }
    location ~* \.avif\.(?:br|gz)$ { types { } default_type image/avif; }
    location ~* \.ico\.(?:br|gz)$ { types { } default_type image/x-icon; }
    location ~* \.woff\.(?:br|gz)$ { types { } default_type font/woff; }
    location ~* \.woff2\.(?:br|gz)$ { types { } default_type font/woff2; }
    location ~* \.ttf\.(?:br|gz)$ { types { } default_type font/ttf; }
    location ~* \.otf\.(?:br|gz)$ { types { } default_type font/otf; }
    location ~* \.eot\.(?:br|gz)$ { types { } default_type application/vnd.ms-fontobject; }
    location ~* \.mp3\.(?:br|gz)$ { types { } default_type audio/mpeg; }
    location ~* \.wav\.(?:br|gz)$ { types { } default_type audio/wav; }
    location ~* \.ogg\.(?:br|gz)$ { types { } default_type audio/ogg; }
    location ~* \.mp4\.(?:br|gz)$ { types { } default_type video/mp4; }
    location ~* \.webm\.(?:br|gz)$ { types { } default_type video/webm; }
    location ~* \.(?:br|gz)$ { types { } default_type application/octet-stream; }

    location / {
        try_files $uri $uri/ =404;
    }
}
