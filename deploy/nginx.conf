# ---------------------------------------------------------------------------
# 还原真实客户端 IP（本站源站位于 Cloudflare 之后）
#
# 链路是 访客 → Cloudflare → 本 nginx → admin-server(Express)。没有下面这段时，
# nginx 的 $remote_addr 是 Cloudflare 边缘 IP，被 $proxy_add_x_forwarded_for 追加
# 进 X-Forwarded-For 的也是它，Express 在 TRUST_PROXY_HOPS=1 下取最右一跳，拿到的
# req.ip 因此是 CF 边缘 IP。后果是登录/TOTP 限流与留言提交限流按边缘节点分桶
# （一个访客触发限流会连累同边缘节点的其他访客），feedback_comments 记录的 IP 也
# 失去取证价值。接 Cloudflare 之前 XFF 只有一项，取最右正好是访客，所以这是接入
# Cloudflare 之后才出现的静默错误：不报错、不崩溃，只是默默算错。
#
# 本文件被挂载为 /etc/nginx/templates/default.conf.template 并渲染进
# conf.d/default.conf，即位于 http {} 上下文内，因此写在这里是 http 级配置，
# 下面三个 server 块（80 跳转、443 主站、443 小作坊）全部生效，无需逐块重复。
#
# 1) 为什么取 CF-Connecting-IP 而不是 X-Forwarded-For：
#    CF-Connecting-IP 由 Cloudflare 写入，保证是单个真实访客 IP、不含代理链，
#    所以不需要开 real_ip_recursive 逐级回溯（保持默认 off 即可）。而 XFF 是
#    追加语义——访客自带一个伪造的 XFF 时，Cloudflare 会把真实 IP 追加在其后而
#    不是覆盖它——解析要复杂得多，也更容易出错。
#
# 2) 为什么必须限定来源网段，绝不能写 0.0.0.0/0：
#    本站源站可以被直连（实测 https://<源站IP>/ 返回 200，Cloudflare 不是唯一入口）。
#    若无条件信任 CF-Connecting-IP，任何人直连源站并自带该头即可任意伪造来源 IP，
#    绕过全部按 IP 的限流。限定网段后，非 Cloudflare 来源发来的该头会被忽略，
#    $remote_addr 保持真实对端地址，伪造无效。
#
# 3) 这份列表需要人工维护：
#    来源是 https://www.cloudflare.com/ips-v4 与 https://www.cloudflare.com/ips-v6，
#    以下为 2026-08-17 取得的完整列表（IPv4 15 条 + IPv6 7 条，共 22 条）。
#    Cloudflare 偶尔增删网段，列表过期的失败模式是「新网段来的请求退回记 CF 边缘
#    IP」——只影响限流精度，属优雅降级、不会中断服务，因此刻意不做成启动时联网
#    拉取（那会给容器启动引入网络依赖，风险更大）。更新列表后需 nginx -t 并 reload。
# ---------------------------------------------------------------------------

# Cloudflare IPv4（15 条）
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# Cloudflare IPv6（7 条）
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;

server {
    listen 80;
    server_name ${SERVER_NAME} ${LAB_SERVER_NAME};

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ${SERVER_NAME};

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    client_max_body_size ${NGINX_CLIENT_MAX_BODY_SIZE};

    location = /health {
        proxy_pass http://admin-server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(?:admin|api|uploads)(?:/|$) {
        proxy_pass http://admin-server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 443 ssl;
    server_name ${LAB_SERVER_NAME};

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    root /srv/zhiliaohub-lab;
    index index.html;
    charset utf-8;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'; form-action 'none'; frame-src 'none'; frame-ancestors 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
