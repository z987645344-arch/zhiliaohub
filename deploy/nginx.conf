# ---------------------------------------------------------------------------
# 还原 gateway 传来的真实客户端 IP
#
# 链路是 访客 → zhiliao-gateway → 本 nginx → admin-server(Express)。
# gateway 以追加语义写入 X-Forwarded-For，本 nginx 只信任现场实测得到的
# Compose 桥网关网段，并在 real_ip_recursive 默认 off 下取 XFF 最右一项。
# 这会把 $remote_addr 还原为真实客户端；随后 $proxy_add_x_forwarded_for
# 追加的最右一项仍是真实客户端，与 Express TRUST_PROXY_HOPS=1 对应。
#
# 信任来源必须精确限定，绝不能写 0.0.0.0/0。无条件信任 XFF 会让任意
# 直连者伪造来源 IP，绕过密码、TOTP、设备认证和反馈提交的按 IP 限流。
# app-network 没有固定子网，网关可随网络重建变化；TRUSTED_PROXY_CIDR 必须由部署现场
# 实测确定，不得把开发机上观察到的桥网关地址写死进仓库。
# ---------------------------------------------------------------------------

set_real_ip_from ${TRUSTED_PROXY_CIDR};
real_ip_header X-Forwarded-For;

server {
    listen 80;
    server_name ${SERVER_NAME};

    root /app/runtime/public/site;
    index index.html;
    charset utf-8;
    client_max_body_size ${NGINX_CLIENT_MAX_BODY_SIZE};

    location = /health {
        proxy_pass http://admin-server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # gateway 只有 TLS :443 server 会反代到本机；写死 https 与本 nginx 只绑回环是同一组承重假设。
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ ^/(?:admin|api|uploads)(?:/|$) {
        proxy_pass http://admin-server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # gateway 只有 TLS :443 server 会反代到本机；写死 https 与本 nginx 只绑回环是同一组承重假设。
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    server_name ${LAB_SERVER_NAME};

    root /app/runtime/public/lab-storage;
    index index.html;
    charset utf-8;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'; form-action 'none'; frame-src 'none'; frame-ancestors 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
